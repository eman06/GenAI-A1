# One command:  docker compose up --build      ->  http://localhost:8080
# Ports busy?    FRONTEND_PORT=8088 BACKEND_PORT=8010 docker compose up --build
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./models_onnx:/models:ro          # ONNX models (download link in README)
      - ./backend/app/samples:/srv/app/samples:ro
    environment:
      - MODELS_DIR=/models
      - ORT_THREADS=2
    ports:
      - "${BACKEND_PORT:-8000}:8000"       # API docs at http://localhost:8000/docs
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
